<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — {{ app_name }}</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MRD Tool">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/mrd.css">
</head>
<body class="mrd-login-page">

<div class="mrd-login-wrapper">
  <div class="mrd-login-card">
    <div class="mrd-login-header">
      <div class="mrd-login-logo">
        <i class="bi bi-tools"></i>
      </div>
      <h1 class="mrd-login-title">MRD TOOL CONTROL</h1>
      <p class="mrd-login-sub">MRD Estructuras</p>
    </div>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <form method="post" action="/login" class="mrd-login-form">
      <input type="hidden" name="_csrf_token" id="csrf_field" value="">
      <div class="mb-3">
        <label class="form-label text-muted small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text mrd-input-icon"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control mrd-input"
                 placeholder="Nombre de usuario" required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label text-muted small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text mrd-input-icon"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="passwordInput"
                 class="form-control mrd-input" placeholder="Contraseña"
                 required autocomplete="current-password">
          <button type="button" class="btn mrd-input-icon" onclick="togglePassword()" aria-label="Mostrar contraseña">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mrd-btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Acceder
      </button>
    </form>

    <a href="/portal-trabajador" class="btn btn-outline-primary w-100 mt-3">
      <i class="bi bi-person-badge me-2"></i>Acceso trabajador con PIN
    </a>

    <div class="mrd-login-footer">
      <small class="text-muted">Sistema de control de herramientas</small>
    </div>
  </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
  var inp = document.getElementById('passwordInput');
  var ico = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    ico.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    ico.className = 'bi bi-eye';
  }
}
</script>

<!-- Service Worker PWA -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch(function(err) { console.warn('SW no registrado:', err); });
  });
}
</script>

</body>
</html>
