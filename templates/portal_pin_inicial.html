<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Crea tu PIN personal · Mi MRD</title>
  <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/portal-trabajador.css?v=2.8.0-cyan">
  <link rel="stylesheet" href="/static/css/worker-login.css?v=2.8.0-cyan">
</head>
<body>
  <main class="worker-login-shell">
    <section class="worker-login-card">
      <div class="worker-login-mark"><img src="/static/img/mrd_sello_blanco.png" alt="MRD Estructuras Tubulares"></div>
      <p class="worker-login-kicker">PRIMER ACCESO</p>
      <h1>Hola, {{ trabajador.nombre }}</h1>
      <p>El PIN 123456 es provisional. Crea ahora uno personal para proteger tu cuenta.</p>
      <form method="post" action="/portal/{{ trabajador.portal_token }}/cambiar-pin">
        <input type="hidden" name="_csrf_token" id="csrf-token">
        <label>PIN provisional<input name="pin_actual" type="password" inputmode="numeric" value="123456" readonly required></label>
        <label>Nuevo PIN<input name="pin_nuevo" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required autofocus></label>
        <label>Repite el nuevo PIN<input name="pin_confirm" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" required></label>
        <button class="portal-primary" type="submit"><i class="bi bi-shield-check"></i> Guardar y entrar</button>
      </form>
    </section>
  </main>
  <script>const value=document.cookie.split('; ').find(v=>v.startsWith('mrd_csrf='))?.split('=').slice(1).join('=')||'';document.getElementById('csrf-token').value=decodeURIComponent(value)</script>
</body>
</html>
