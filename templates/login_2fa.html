<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación en dos pasos — {{ app_name }}</title>

  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">

  <link rel="stylesheet" href="/static/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/mrd.css">
</head>
<body class="mrd-login-page">

<div class="mrd-login-wrapper">
  <div class="mrd-login-card">
    <div class="mrd-login-header">
      <div class="mrd-login-logo">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h1 class="mrd-login-title">Verificación en dos pasos</h1>
      <p class="mrd-login-sub">Introduce el código de tu app de autenticación</p>
    </div>

    {% if error %}
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}

    <form method="post" action="/login/2fa" class="mrd-login-form">
      <div class="mb-4">
        <label class="form-label text-muted small">Código de 6 dígitos</label>
        <div class="input-group">
          <span class="input-group-text mrd-input-icon"><i class="bi bi-key"></i></span>
          <input type="text" name="codigo" class="form-control mrd-input" inputmode="numeric"
                 pattern="[0-9]*" maxlength="6" placeholder="000000" required autofocus autocomplete="one-time-code">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mrd-btn-login">
        <i class="bi bi-check2-circle me-2"></i>Verificar
      </button>
    </form>

    <a href="/login" class="btn btn-outline-secondary w-100 mt-3">
      <i class="bi bi-arrow-left me-2"></i>Cancelar
    </a>
  </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
