<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almacén · MRD</title><link rel="stylesheet" href="/static/css/bootstrap-icons.min.css">
<style>body{margin:0;background:#0b1220;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:22px;overflow:hidden}.tv{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr 1fr;gap:18px;padding:18px;height:100vh;box-sizing:border-box}.head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:2rem}.head .clock{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}.box{background:#111a2e;border-radius:18px;padding:16px 20px;overflow:hidden;display:flex;flex-direction:column}.box h2{margin:0 0 10px;font-size:1.3rem;color:#93c5fd;letter-spacing:.06em;text-transform:uppercase}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1f2a44}.row:last-child{border:0}.big{font-size:1.5rem;font-weight:700}.tag{border-radius:999px;padding:2px 12px;font-size:1rem;background:#1e3a5f}.tag.urg{background:#b91c1c}.tag.ok{background:#166534}.muted{color:#94a3b8;font-size:1rem}.empty{color:#64748b}.cola{grid-row:2/4}.n{font-size:2.6rem;font-weight:800;line-height:1}</style></head><body>
<div class="tv"><div class="head"><div><h1><i class="bi bi-shop"></i> Almacén MRD</h1><div class="muted" id="fecha">{{ datos.fecha }}</div></div><div class="clock" id="hora">{{ datos.hora }}</div></div>
<div class="box cola"><h2>Cola de pedidos <span class="n" id="n-cola">{{ datos.cola|length }}</span></h2><div id="cola"></div></div>
<div class="box"><h2>Listos sin recoger <span class="n" id="n-listos">{{ datos.listos|length }}</span></h2><div id="listos"></div></div>
<div class="box"><h2>Plazos vencidos y avisos</h2><div id="vencidos"></div><div id="avisos" style="margin-top:8px"></div></div></div>
<script>const D={{ datos|tojson }};const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pinta(d){document.getElementById('hora').textContent=d.hora;document.getElementById('fecha').textContent=d.fecha;document.getElementById('n-cola').textContent=d.cola.length;document.getElementById('n-listos').textContent=d.listos.length;
document.getElementById('cola').innerHTML=d.cola.length?d.cola.map(c=>`<div class="row"><div><div class="big">${esc(c.trabajador)}</div><div class="muted">${esc(c.numero)} ${c.para?'· '+esc(c.para):''}</div></div><div><span class="tag ${c.urgente?'urg':''}">${c.urgente?'VIENE / URGENTE':esc(c.estado)}</span></div></div>`).join(''):'<div class="empty">Nada por preparar</div>';
document.getElementById('listos').innerHTML=d.listos.length?d.listos.map(l=>`<div class="row"><div><div class="big">${esc(l.trabajador)}</div><div class="muted">${esc(l.numero)} · listo hace ${l.minutos>=60?Math.floor(l.minutos/60)+' h':l.minutos+' min'}</div></div><div>${l.voy?'<span class="tag ok">VIENE A POR ÉL</span>':''}</div></div>`).join(''):'<div class="empty">Todo recogido</div>';
document.getElementById('vencidos').innerHTML=d.vencidos.length?d.vencidos.map(v=>`<div class="row"><div><div class="big">${esc(v.nombre)}</div><div class="muted">${esc(v.quien)}</div></div><span class="tag urg">${v.dias} día${v.dias===1?'':'s'} tarde</span></div>`).join(''):'<div class="empty">Sin plazos vencidos</div>';
document.getElementById('avisos').innerHTML=d.avisos.map(a=>`<div class="row"><div class="muted">${esc(a.hora)} · ${esc(a.titulo)}</div></div>`).join('')}
pinta(D);setInterval(async()=>{try{const r=await fetch('/tv/api'+location.search,{headers:{Accept:'application/json'}});if(r.ok)pinta(await r.json())}catch(e){}},20000);</script></body></html>
