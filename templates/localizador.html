{% extends "base.html" %}{% block title %}Localizador visual{% endblock %}{% block content %}
<style>.loc-hero{background:linear-gradient(135deg,#064e3b,#10b981);color:#fff;padding:24px;border-radius:18px}.loc-result{margin-top:16px;padding:18px;border:2px solid #10b981;border-radius:16px;background:var(--surface)}</style>
<section class="loc-hero"><h1><i class="bi bi-geo-alt-fill"></i> Llévame hasta el artículo</h1><p>{{ almacen.nombre }} · Escanea o busca. El mapa abrirá la zona, estantería, balda y posición.</p></section>
<section class="card mt-3"><div class="card-body"><div class="input-group"><input id="locator-code" class="form-control form-control-lg" placeholder="Nombre, QR o referencia"><button id="locator-search" class="btn btn-success">Localizar</button></div><div id="locator-results"></div><div id="locator-state" class="small mt-2"></div></div></section>
<script>(()=>{const input=document.getElementById('locator-code'),box=document.getElementById('locator-results'),state=document.getElementById('locator-state');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function go(){const q=input.value.trim();if(!q)return;state.textContent='Buscando ubicación…';let r=await fetch('/api/mostrador/resolver?codigo='+encodeURIComponent(q),{headers:{Accept:'application/json'}}),d=await r.json();if(r.ok){show([d.item]);return}r=await fetch('/api/mostrador/buscar?q='+encodeURIComponent(q),{headers:{Accept:'application/json'}});d=await r.json();if(!r.ok){state.textContent=d.detail||'No encontrado';return}show(d.items||[])}function show(items){state.textContent=items.length?items.length+' coincidencia(s)':'No hay coincidencias';box.innerHTML=items.map(i=>`<div class="loc-result"><b>${esc(i.nombre)}</b><div>${esc(i.codigo)} · ${esc(i.estado)}</div><a class="btn btn-success mt-2" href="/almacenes/{{ almacen.id }}/mapa?buscar=${encodeURIComponent(i.codigo||i.nombre)}"><i class="bi bi-sign-turn-right"></i> Mostrar en el mapa</a></div>`).join('')}input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};document.getElementById('locator-search').onclick=go})();</script>
{% endblock %}
