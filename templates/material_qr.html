{% extends "base.html" %}
{% block title %}QR — {{ mat.nombre }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="/materiales/{{ mat.id }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
  <h4 class="mb-0"><i class="bi bi-qr-code text-success me-2"></i>Codigo QR — {{ mat.nombre }}</h4>
</div>
<div class="text-center py-4">
  <div class="card d-inline-block p-4 shadow-sm" style="max-width:400px">
    <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR" class="img-fluid mb-3" style="max-width:280px">
    <p class="text-muted small mb-2">{{ url }}</p>
    <p class="fw-semibold mb-1">{{ mat.nombre }}</p>
    {% if mat.codigo %}<p class="font-monospace text-muted small">{{ mat.codigo }}</p>{% endif %}
    <button class="btn btn-outline-secondary btn-sm mt-2" onclick="window.print()">
      <i class="bi bi-printer me-1"></i>Imprimir
    </button>
  </div>
</div>
{% endblock %}
