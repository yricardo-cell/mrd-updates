name: mrd_app
description: MRD TOOL CONTROL — Aplicación móvil oficial
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP / API
  dio: ^5.4.0
  dio_smart_retry: ^6.0.0

  # Autenticación y almacenamiento seguro
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # Base de datos local (offline)
  sqflite: ^2.3.0
  path: ^1.8.3

  # Estado
  provider: ^6.1.2

  # Escáner QR / código de barras
  mobile_scanner: ^5.1.1

  # Cámara / fotos
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # Firma digital
  signature: ^5.4.0

  # Conectividad
  connectivity_plus: ^6.0.3

  # Notificaciones push (Firebase)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.20
  flutter_local_notifications: ^17.0.0

  # Geolocalización
  geolocator: ^11.0.0
  permission_handler: ^11.3.1

  # Utilidades UI
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  intl: ^0.19.0
  timeago: ^3.6.1
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  pdf: ^3.10.8
  printing: ^5.12.0
  open_file: ^3.3.2

  # Cifrado local
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Iconos
  cupertino_icons: ^1.0.6
  flutter_phosphor_icons: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
