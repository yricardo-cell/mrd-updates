<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  try {
    var saved = localStorage.getItem("sentinel-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* localStorage no disponible: se queda en el tema por defecto */ }
})();
</script>
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-muted: #f5f7fb;
    --border: #dde3ed;
    --text: #1c2534;
    --text-muted: #5b6577;
    --accent: #1d5fbf;
    --accent-hover: #164a97;
    --ok: #0a7a4a;
    --ok-bg: #e6f6ee;
    --warn: #92650a;
    --warn-bg: #fbf0da;
    --bad: #b3261e;
    --bad-bg: #fbe9e8;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(23, 32, 51, 0.08);
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #050810;
    --surface: rgba(255, 255, 255, 0.05);
    --surface-muted: rgba(255, 255, 255, 0.08);
    --border: rgba(120, 210, 255, 0.35);
    --text: #e7ebf3;
    --text-muted: #9aa6ba;
    --accent: #3ee1f5;
    --accent-hover: #7becfa;
    --ok: #3fcf8e;
    --ok-bg: rgba(63, 207, 142, 0.14);
    --warn: #e3b23e;
    --warn-bg: rgba(227, 178, 62, 0.14);
    --bad: #f2685e;
    --bad-bg: rgba(242, 104, 94, 0.14);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  /* ===== fondo fotografico HUD (solo tema oscuro) ===== */
  :root[data-theme="dark"] html,
  :root[data-theme="dark"] body { background-color: transparent; }

  .bg-photo, .bg-photo-overlay, .bg-scanline, .sentinel-core { display: none; }

  :root[data-theme="dark"] .bg-photo {
    display: block;
    position: fixed; inset: 0; z-index: -4;
    background-color: #050810;
    background-image: url("/static/img/nexus-bg.jpg");
    background-size: cover;
    background-position: center 22%;
    filter: blur(2px) saturate(1.05);
    transform: scale(1.03);
  }

  :root[data-theme="dark"] .bg-photo-overlay {
    display: block;
    position: fixed; inset: 0; z-index: -3;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%, rgba(20, 60, 110, 0.2), transparent 70%),
      linear-gradient(180deg, rgba(3, 8, 20, 0.72), rgba(4, 10, 22, 0.68) 45%, rgba(2, 5, 14, 0.85) 100%);
  }

  :root[data-theme="dark"] .bg-scanline {
    display: block;
    position: fixed; left: 0; right: 0; top: -2px; height: 2px; z-index: -2;
    background: linear-gradient(90deg, transparent, rgba(120, 210, 255, 0.5), transparent);
    animation: scanDescend 9s linear infinite;
    pointer-events: none;
  }

  @keyframes scanDescend {
    0% { top: -2px; opacity: 0; }
    5% { opacity: 0.6; }
    95% { opacity: 0.6; }
    100% { top: 100%; opacity: 0; }
  }

  :root[data-theme="dark"] .sentinel-core {
    display: block;
    position: fixed; right: 4vw; bottom: 6vh; width: min(20vw, 200px); aspect-ratio: 1;
    z-index: -1; pointer-events: none;
  }
  .sentinel-core svg { width: 100%; height: 100%; overflow: visible; }
  .sentinel-core .cr { fill: none; stroke: var(--accent); transform-origin: 100px 100px; }
  .sentinel-core .r1 { stroke-width: 1.2; stroke-dasharray: 5 9; opacity: 0.4; animation: ringSpin 18s linear infinite; }
  .sentinel-core .r2 { stroke-width: 1.6; stroke-dasharray: 2 7; opacity: 0.55; filter: drop-shadow(0 0 4px var(--accent)); animation: ringSpin 12s linear infinite reverse; }
  .sentinel-core .r3 { stroke-width: 2; opacity: 0.7; filter: drop-shadow(0 0 7px var(--accent)); animation: ringSpin 24s linear infinite; }
  @keyframes ringSpin { to { transform: rotate(360deg); } }
  .sentinel-core .core-pulse {
    position: absolute; inset: 30%; border-radius: 50%;
    background: radial-gradient(circle, rgba(160, 230, 255, 0.5), rgba(62, 225, 245, 0.15) 55%, transparent 75%);
    filter: blur(2px);
    animation: corePulseGlow 2.6s ease-in-out infinite;
  }
  @keyframes corePulseGlow {
    0%, 100% { opacity: 0.5; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  :root[data-theme="dark"] .theme-toggle,
  :root[data-theme="dark"] .auth-card,
  :root[data-theme="dark"] section,
  :root[data-theme="dark"] .metric,
  :root[data-theme="dark"] .topbar {
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
  }

  :root[data-theme="dark"] .brand-mark,
  :root[data-theme="dark"] .auth-icon,
  :root[data-theme="dark"] button { color: #04121a; }

  :root[data-theme="dark"] input:focus-visible {
    box-shadow: 0 0 0 3px rgba(62, 225, 245, 0.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-scanline, .sentinel-core .cr, .sentinel-core .core-pulse { animation: none !important; }
  }

  .icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: -4px; }
  .icon-sm { width: 15px; height: 15px; vertical-align: -3px; }

  .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-moon { display: inline-block; }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    min-height: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .theme-toggle:hover { background: var(--bg); color: var(--text); }
  .theme-toggle .icon { margin: 0; vertical-align: middle; }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 26px 20px 48px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }

  .topbar h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .topbar .session {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text);
    font-weight: 700;
    font-size: 0.78rem;
    flex-shrink: 0;
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-ghost:hover {
    background: var(--bg);
    text-decoration: none;
    color: var(--text);
  }

  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 28px;
  }

  .auth-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }

  .auth-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    margin-bottom: 14px;
  }

  .auth-card h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .auth-card h2 {
    font-size: 1rem;
    color: var(--text-muted);
    margin: 0 0 20px;
    font-weight: 500;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  h1, h2, h3 { color: var(--text); }
  h2 { font-size: 1.05rem; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.005em; }
  h3 { font-size: 0.92rem; color: var(--text-muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin: 0 0 18px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(29, 95, 191, 0.18);
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    min-height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 3px solid rgba(29, 95, 191, 0.35); outline-offset: 2px; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 18px;
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
    .sentinel-core { display: none !important; }
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }

  .metric .metric-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .metric strong {
    display: block;
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 8px 0 4px;
  }

  .metric small { color: var(--text-muted); font-size: 0.82rem; }

  .metric-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
    margin-top: 10px;
  }

  .metric-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }

  .metric-bar > span.ok { background: var(--ok); }
  .metric-bar > span.warn { background: var(--warn); }
  .metric-bar > span.bad { background: var(--bad); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { background: var(--surface-muted); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-muted); }

  @media (max-width: 680px) {
    .history-table thead { display: none; }
    .history-table, .history-table tbody, .history-table tr, .history-table td { display: block; width: 100%; }
    .history-table tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .history-table tr:last-child { border-bottom: none; }
    .history-table td {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: none;
      padding: 4px 4px;
      white-space: normal;
      text-align: right;
    }
    .history-table td::before {
      content: attr(data-label);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-align: left;
      flex-shrink: 0;
    }
  }

  .field-error { display: flex; align-items: center; gap: 8px; color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 0.9rem; }
  .muted { color: var(--text-muted); }
  .form-hint { font-size: 0.85rem; margin: -4px 0 14px; }
  .form-actions { margin-top: 6px; }

  .form-grid .span-2 { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="bg-photo"></div>
<div class="bg-photo-overlay"></div>
<div class="bg-scanline"></div>
<div class="sentinel-core">
  <span class="core-pulse"></span>
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <circle class="cr r1" cx="100" cy="100" r="90"/>
    <circle class="cr r2" cx="100" cy="100" r="65"/>
    <circle class="cr r3" cx="100" cy="100" r="42"/>
  </svg>
</div>
{% block content %}{% endblock %}
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) { return; }
  btn.addEventListener("click", function () {
    var isDark = document.documentElement.getAttribute("data-theme") === "dark";
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sentinel-theme", next); } catch (e) { /* sin persistencia disponible */ }
  });
})();
</script>
</body>
</html>
