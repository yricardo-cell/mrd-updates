<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  try {
    var saved = localStorage.getItem("sentinel-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    } else {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* localStorage no disponible: se queda en el tema por defecto */ }
})();
</script>
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
  :root {
    --bg: #eef1f6;
    --surface: rgba(255, 255, 255, 0.85);
    --surface-muted: rgba(245, 247, 251, 0.85);
    --border: #dde3ed;
    --text: #1c2534;
    --text-muted: #5b6577;
    --accent: #1d5fbf;
    --accent-hover: #164a97;
    --ok: #0a7a4a;
    --ok-bg: #e6f6ee;
    --warn: #92650a;
    --warn-bg: #fbf0da;
    --bad: #b3261e;
    --bad-bg: #fbe9e8;
    --unknown: #5b6577;
    --unknown-bg: #e7e9ee;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(23, 32, 51, 0.08);
    --sky-top: #bfe3ff;
    --sky-bottom: #eef8ff;
    --sea-1: #2e7fb0;
    --sea-2: #4fa8d8;
    --sea-3: #7fc7e8;
    --celestial: radial-gradient(circle, #fff6d8 0%, #ffe89a 55%, rgba(255, 232, 154, 0) 75%);
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #050810;
    --surface: rgba(12, 20, 34, 0.62);
    --surface-muted: rgba(12, 20, 34, 0.78);
    --border: rgba(120, 210, 255, 0.35);
    --text: #e7ebf3;
    --text-muted: #9aa6ba;
    --accent: #3ee1f5;
    --accent-hover: #7becfa;
    --ok: #3fcf8e;
    --ok-bg: rgba(63, 207, 142, 0.14);
    --warn: #e3b23e;
    --warn-bg: rgba(227, 178, 62, 0.14);
    --bad: #f2685e;
    --bad-bg: rgba(242, 104, 94, 0.14);
    --unknown: #9aa6ba;
    --unknown-bg: rgba(154, 166, 186, 0.14);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --sky-top: #030711;
    --sky-bottom: #0a1730;
    --sea-1: #030b16;
    --sea-2: #0a2338;
    --sea-3: #123655;
    --celestial: radial-gradient(circle, #eaf6ff 0%, #bcdcf5 55%, rgba(188, 220, 245, 0) 75%);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  /* ===== fondo de mar, 100% CSS/SVG (sin fotos ni dependencias externas) ===== */
  .bg-sea {
    position: fixed;
    inset: 0;
    z-index: -5;
    overflow: hidden;
    background: linear-gradient(
      180deg,
      var(--sky-top) 0%,
      var(--sky-bottom) 55%,
      var(--sea-1) 56%,
      var(--sea-1) 100%
    );
    transition: background 0.3s ease;
  }

  .bg-sun {
    position: absolute;
    top: 10%;
    right: 12%;
    width: min(14vw, 140px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--celestial);
    filter: blur(0.5px);
  }

  .bg-wave {
    position: absolute;
    left: 0;
    width: 200%;
    height: 22vh;
    min-height: 140px;
  }

  .bg-wave-1 { bottom: 8vh; opacity: 0.55; animation: waveDrift 26s linear infinite; }
  .bg-wave-2 { bottom: 3vh; opacity: 0.75; animation: waveDrift 19s linear infinite reverse; }
  .bg-wave-3 { bottom: -1vh; opacity: 0.95; animation: waveDrift 13s linear infinite; }

  @keyframes waveDrift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* ===== vidrio esmerilado uniforme para todas las tarjetas ===== */
  .theme-toggle,
  .auth-card,
  section,
  details.app-card,
  div.app-card,
  .btn-hud,
  .metric,
  .chart-card,
  .topbar {
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }

  :root[data-theme="dark"] .brand-mark,
  :root[data-theme="dark"] .auth-icon,
  :root[data-theme="dark"] button { color: #04121a; }

  :root[data-theme="dark"] .btn-hud { color: var(--text); }
  :root[data-theme="dark"] .btn-hud-bad { color: var(--bad); }

  :root[data-theme="dark"] input:focus-visible {
    box-shadow: 0 0 0 3px rgba(62, 225, 245, 0.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-wave { animation: none !important; }
  }

  .icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: -4px; }
  .icon-sm { width: 15px; height: 15px; vertical-align: -3px; }

  .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-moon { display: inline-block; }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    padding: 0;
    min-height: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
  }

  .theme-toggle:hover { background: var(--bg); color: var(--text); }
  .theme-toggle .icon { margin: 0; vertical-align: middle; }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 26px 20px 48px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }

  .topbar h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .topbar .session {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text);
    font-weight: 700;
    font-size: 0.78rem;
    flex-shrink: 0;
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-ghost:hover {
    background: var(--bg);
    text-decoration: none;
    color: var(--text);
  }

  .auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 28px;
  }

  .auth-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }

  .auth-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    margin-bottom: 14px;
  }

  .auth-card h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .auth-card h2 {
    font-size: 1rem;
    color: var(--text-muted);
    margin: 0 0 20px;
    font-weight: 500;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  h1, h2, h3 { color: var(--text); }
  h2 { font-size: 1.05rem; margin: 0 0 12px; font-weight: 700; letter-spacing: -0.005em; }
  h3 { font-size: 0.92rem; color: var(--text-muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin: 0 0 18px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(29, 95, 191, 0.18);
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    min-height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 3px solid rgba(29, 95, 191, 0.35); outline-offset: 2px; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 18px;
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .metric {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }

  .metric .metric-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .metric strong {
    display: block;
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 8px 0 4px;
  }

  .metric small { color: var(--text-muted); font-size: 0.82rem; }

  .metric-bar {
    height: 6px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
    margin-top: 10px;
  }

  .metric-bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
  }

  .metric-bar > span.ok { background: var(--ok); }
  .metric-bar > span.warn { background: var(--warn); }
  .metric-bar > span.bad { background: var(--bad); }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 18px;
  }

  .chart-card .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .chart-card .chart-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chart-card .chart-legend i {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .chart-card canvas { width: 100%; height: 160px; display: block; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.unknown { color: var(--unknown); background: var(--unknown-bg); }

  .apps-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .app-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { background: var(--surface-muted); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-muted); }

  @media (max-width: 680px) {
    .history-table thead { display: none; }
    .history-table, .history-table tbody, .history-table tr, .history-table td { display: block; width: 100%; }
    .history-table tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .history-table tr:last-child { border-bottom: none; }
    .history-table td {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      border-bottom: none;
      padding: 4px 4px;
      white-space: normal;
      text-align: right;
    }
    .history-table td::before {
      content: attr(data-label);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-align: left;
      flex-shrink: 0;
    }
  }

  .field-error { display: flex; align-items: center; gap: 8px; color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 0.9rem; }
  .muted { color: var(--text-muted); }

  /* Texto que flota directamente sobre el fondo de mar (sin tarjeta detrás)
     necesita su propio respaldo de vidrio para seguir siendo legible. */
  .floating-note {
    display: inline-block;
    background: var(--surface);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-radius: 8px;
    padding: 6px 12px;
    margin: 0 0 14px;
  }
  .form-hint { font-size: 0.85rem; margin: -4px 0 14px; }
  .form-actions { margin-top: 6px; }

  .form-grid .span-2 { grid-column: 1 / -1; }

  .banner-ok {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ok);
    background: var(--ok-bg);
    border-radius: 8px;
    padding: 8px 12px;
    margin: 0 0 14px;
    font-size: 0.9rem;
  }

  .control-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 18px;
  }

  .btn-hud {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    min-height: 38px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .btn-hud:hover { border-color: var(--accent); text-decoration: none; }
  .btn-hud:focus-visible { outline: 3px solid rgba(29, 95, 191, 0.3); outline-offset: 2px; }

  .btn-hud-bad { color: var(--bad); border-color: var(--bad); }
  .btn-hud-disabled { color: var(--text-muted); cursor: default; }

  .action-row form { margin: 0; display: inline-flex; }
  .action-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .action-row .btn-hud { padding: 7px 12px; min-height: 34px; font-size: 0.82rem; }

  .status-ring {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-ring.ok { background: var(--ok); }
  .status-ring.warn { background: var(--warn); }
  .status-ring.bad { background: var(--bad); animation: statusPulse 1.4s ease-in-out infinite; }
  .status-ring.unknown { background: var(--unknown); }

  @keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  details.app-card, div.app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin: 0 0 18px;
  }

  div.app-card .app-title {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  details.app-card summary {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    cursor: pointer;
    list-style: none;
  }

  details.app-card summary::-webkit-details-marker { display: none; }

  details.app-card summary .chevron {
    margin-left: auto;
    transition: transform 0.15s ease;
  }

  details.app-card[open] summary .chevron { transform: rotate(180deg); }

  .kv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 18px;
    font-size: 0.88rem;
    margin: 16px 0 0;
  }

  .kv-grid dt { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
  .kv-grid dd { margin: 3px 0 0; color: var(--text); word-break: break-word; }
  .kv-grid .span-2 { grid-column: 1 / -1; }

  @media (max-width: 640px) {
    .kv-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="bg-sea" aria-hidden="true">
  <div class="bg-sun"></div>
  <svg class="bg-wave bg-wave-1" viewBox="0 0 2400 200" preserveAspectRatio="none">
    <path fill="var(--sea-3)" d="M0,100 C150,60 300,140 600,100 C900,60 1050,140 1200,100 C1350,60 1500,140 1800,100 C2100,60 2250,140 2400,100 L2400,200 L0,200 Z"/>
  </svg>
  <svg class="bg-wave bg-wave-2" viewBox="0 0 2400 200" preserveAspectRatio="none">
    <path fill="var(--sea-2)" d="M0,100 C150,60 300,140 600,100 C900,60 1050,140 1200,100 C1350,60 1500,140 1800,100 C2100,60 2250,140 2400,100 L2400,200 L0,200 Z"/>
  </svg>
  <svg class="bg-wave bg-wave-3" viewBox="0 0 2400 200" preserveAspectRatio="none">
    <path fill="var(--sea-1)" d="M0,100 C150,60 300,140 600,100 C900,60 1050,140 1200,100 C1350,60 1500,140 1800,100 C2100,60 2250,140 2400,100 L2400,200 L0,200 Z"/>
  </svg>
</div>
{% block content %}{% endblock %}
<script>
(function () {
  var btn = document.getElementById("theme-toggle");
  if (!btn) { return; }
  btn.addEventListener("click", function () {
    var isDark = document.documentElement.getAttribute("data-theme") === "dark";
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sentinel-theme", next); } catch (e) { /* sin persistencia disponible */ }
  });
})();
</script>
</body>
</html>
