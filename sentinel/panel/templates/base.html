<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
:root { font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
body { max-width: 1100px; margin: 0 auto; padding: 24px; }
header, section, .metric { background: #fff; border: 1px solid #dbe3ef; border-radius: 12px; padding: 18px; margin: 0 0 16px; box-shadow: 0 2px 8px #1720330d; }
a { color: #185abd; } input, button { padding: 9px 10px; margin: 4px 0 10px; border: 1px solid #b9c7d9; border-radius: 7px; } button { background: #185abd; color: white; cursor: pointer; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; } .metric strong { display: block; font-size: 1.35rem; margin-top: 5px; }
.ok { color: #087443; } .bad { color: #b42318; } table { width: 100%; border-collapse: collapse; } th, td { padding: 7px; border-bottom: 1px solid #e1e7ef; text-align: left; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
