{% extends "base.html" %}
{% block title %}{{ app_name }} — Acceso{% endblock %}
{% block content %}
<h1>{{ app_name }}</h1>
{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
  <label>Usuario<br><input type="text" name="username" required autofocus></label><br>
  <label>Contraseña<br><input type="password" name="password" required></label><br>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
