{% extends "base.html" %}
{% block title %}{{ app_name }} — Configuración inicial{% endblock %}
{% block content %}
<h1>{{ app_name }}</h1>
<h2>Configuración inicial</h2>
<p>Crea la cuenta con la que entrarás al panel 24/7.</p>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="/setup">
  <label>Usuario<br><input type="text" name="username" maxlength="80" required autofocus></label><br>
  <label>Contraseña<br><input type="password" name="password" minlength="8" required></label><br>
  <label>Repite la contraseña<br><input type="password" name="password_confirm" minlength="8" required></label><br>
  <button type="submit">Crear cuenta</button>
</form>
{% endblock %}
