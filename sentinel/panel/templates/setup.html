{% extends "base.html" %}
{% block title %}{{ app_name }} — Configuración inicial{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-head">
      <span class="auth-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c1-3.2 3.2-4.8 5.5-4.8s4.5 1.6 5.5 4.8"/><path d="M18 8v5M15.5 10.5h5"/></svg>
      </span>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
    <h1>{{ app_name }}</h1>
    <h2>Configuración inicial</h2>
    <p class="muted">Crea la cuenta con la que entrarás al panel 24/7.</p>
    {% if error %}
    <p class="field-error">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      {{ error }}
    </p>
    {% endif %}
    <form method="post" action="/setup">
      <label>Usuario<input type="text" name="username" maxlength="80" required autofocus></label>
      <label>Contraseña<input type="password" name="password" minlength="8" required></label>
      <label>Repite la contraseña<input type="password" name="password_confirm" minlength="8" required></label>
      <button type="submit">Crear cuenta</button>
    </form>
  </div>
</div>
{% endblock %}
